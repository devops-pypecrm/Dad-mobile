name: dad_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.6+10

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Real brand icons (e.g. WhatsApp) — Flutter's built-in Material `Icons`
  # has no actual WhatsApp glyph, only generic chat-bubble icons. Must be
  # >=11.0.0 — versions before that subclass Flutter's `IconData`, which
  # became a `final` class in a recent Flutter SDK release
  # (flutter/flutter#181342) and no longer compiles; 11.0.0 fixed this by
  # introducing a separate `FaIconData`/`FaIcon` pair instead (a breaking
  # change from the plain `Icon(FontAwesomeIcons.x)` usage older versions
  # allowed).
  font_awesome_flutter: ^11.0.0

  # Locale-aware compact currency formatting (mirrors Dad-frontend's
  # Intl.NumberFormat-based formatCurrencyCompact in src/lib/utils.ts).
  intl: ^0.19.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking & Auth
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Routing
  go_router: ^14.6.2

  # Note: the animated bottom nav bar (curved notch, selected tab rises
  # into a sliding circle) is vendored at lib/core/widgets/curved_nav_bar/
  # rather than a pub dependency — needed a drop shadow on the circle that
  # the published package's public API has no parameter for. See that
  # folder's curved_navigation_bar.dart file header for details.

  # Native integrations (call/email/WhatsApp quick actions on Lead Detail)
  url_launcher: ^6.3.1

  # Reads this running build's own version/build number, compared against
  # the server's published version manifest for in-app update checks.
  package_info_plus: ^8.1.2

  # Cache dir to download the update .apk into (already a transitive dep
  # via other plugins, promoted to direct since we import it ourselves).
  path_provider: ^2.1.5

  # Remembers which update version the user already dismissed the "Update
  # available" dialog for — plain non-sensitive UI state, so this (not
  # flutter_secure_storage, which is deliberately scoped to auth data only
  # — see SecureStorageService's doc comment) is the right tool.
  shared_preferences: ^2.3.3

  # Field Force Check-ins (Phase 3)
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  connectivity_plus: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Push Notifications (Phase 3)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Charts (Phase 4 — Targets, Reports)
  fl_chart: ^0.69.0

  # Loading skeletons (Phase 5 — hardening pass)
  shimmer: ^3.0.0

  # Call recording playback (Phase 5 of CALL_RECORDING_PLAN.md) — plays
  # CallLog.recordingUrl, which was modeled but never rendered until now.
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

  flutter_launcher_icons: ^0.14.1

# Source image + platform targets for `dart run flutter_launcher_icons`.
# Regenerate with that command whenever any assets/icon/app_icon*.png
# changes. `adaptive_icon_background` is white — the logo mark's outer
# black ring was getting clipped by circular/squircle launcher masks at a
# larger fill (previously transparent + ~78% fill; pulled back to ~68%
# with a white backing, matching how the icon is meant to be seen).
# `adaptive_icon_monochrome` is the themed-icon (Android 13+ Material You)
# layer: without it, a launcher with "Themed icons" on has no app-provided
# silhouette to recolor and synthesizes its own — which is what was
# producing an unwanted padding/background box even with a transparent
# color icon. Android ignores this layer's actual RGB values and only uses
# its alpha shape, tinting it with the current theme color.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  # Default is 16 — doubles up with the padding already baked into the
  # foreground/monochrome images themselves (per explicit "fill the whole
  # icon" request), so it's zeroed out here instead.
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/app_logo.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
